<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09705F">
<title>Monza AI — no connection</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #F3F5F9; color: #17202E;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  .card { max-width: 380px; text-align: center; background: #fff; border: 1px solid #DFE5EF; border-radius: 16px; padding: 28px 24px;
          box-shadow: 0 1px 2px rgba(23,32,46,.05), 0 10px 30px rgba(23,32,46,.07); }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 18px; margin: 16px 0 6px; }
  p { margin: 0 0 18px; color: #4C596D; }
  button { appearance: none; border: 0; border-radius: 12px; min-height: 44px; padding: 0 22px; font: inherit; font-weight: 650;
           color: #fff; background: linear-gradient(90deg, #09705F, #2F6FD8); cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>No internet connection</h1>
    <p>Monza AI works live with your chats and customers, so it needs a connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
